<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" fill="none">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2f3133" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#404346"/>
      <stop offset="100%" stop-color="#2b2e31"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8beaa"/>
      <stop offset="100%" stop-color="#9ea58f"/>
    </linearGradient>
    <linearGradient id="terracotta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d49674"/>
      <stop offset="100%" stop-color="#bf7a55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="#F6F1EA"/>

  <!-- Icon -->
  <g transform="translate(72 45)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="250" rx="14" fill="#FBF8F3" stroke="url(#metalDark)" stroke-width="18"/>

    <!-- top inner panel -->
    <path d="M36 36H214L125 125L36 36Z" fill="url(#sage)"/>

    <!-- lower cream plane -->
    <path d="M118 132L207 221H118V132Z" fill="#EFE8DE"/>

    <!-- terracotta accent -->
    <path d="M145 170L198 117V223L145 170Z" fill="url(#terracotta)"/>

    <!-- geometric M / frame lines -->
    <path d="M28 28L28 230H90V118L125 153L160 118L222 56V230" stroke="url(#metalDark)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M28 28L125 125L222 28" stroke="url(#metalDark)" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M90 118V230" stroke="url(#metalDark)" stroke-width="24" stroke-linecap="square"/>
  </g>

  <!-- Brand name -->
  <g transform="translate(390 80)">
    <text x="0" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#2F3133" letter-spacing="-2">Metalia Design</text>

    <line x1="180" y1="170" x2="520" y2="170" stroke="#C2815F" stroke-width="6" stroke-linecap="round"/>
    <circle cx="560" cy="170" r="8" fill="#C2815F"/>
    <line x1="600" y1="170" x2="940" y2="170" stroke="#C2815F" stroke-width="6" stroke-linecap="round"/>

    <text x="35" y="245" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="500" fill="#A0A792" letter-spacing="10">DISEÑO METÁLICO PARA ESPACIOS ÚNICOS</text>
  </g>
</svg>
